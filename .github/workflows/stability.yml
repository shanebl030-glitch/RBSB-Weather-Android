# Stability audit for a stable release: Android lint, and on Android 10, 12, 14 and 15 the full
# emulator walk-through plus 5 rounds of random use (monkey), failing on any crash or ANR.
# Created By Shane BlackbuRn
name: Stability audit

on:
  push:
    branches: ["claude/android-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint
        run: ./gradlew --no-daemon lintRelease
      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          for x in glob.glob("app/build/reports/lint-results-release.xml"):
              issues = ET.parse(x).getroot().findall("issue")
              c = collections.Counter((i.get("severity"), i.get("id")) for i in issues)
              print(f"LINT: {len(issues)} issues")
              for (sev, iid), n in sorted(c.items()): print(f"LINT {sev} {iid}: {n}")
              for i in issues:
                  if i.get("severity") in ("Error", "Fatal") or i.get("id") in ("NewApi", "MissingPermission", "UnspecifiedRegisterReceiverFlag", "StaticFieldLeak", "Recycle", "WrongThread", "InlinedApi", "ObsoleteSdkInt", "UnsafeOptInUsageError", "DiscouragedApi", "ExportedReceiver", "ExportedService"):
                      loc = i.find("location")
                      print("LINT DETAIL", i.get("severity"), i.get("id"), loc.get("file").split("/app/")[-1] if loc is not None else "", loc.get("line") if loc is not None else "", "-", i.get("message"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-report, path: app/build/reports/lint-results-release.*, retention-days: 14 }

  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Picture comparison tool
        run: python3 -m pip install --quiet pillow || pip install --quiet --break-system-packages pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk-through and random use on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 256M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"; bash scripts/emulator/drive.sh "$APK" emu-out; W=$?; echo "WALKTHROUGH EXIT: $W"; adb uninstall io.github.shanebl030glitch.rbsbweather >/dev/null; bash scripts/emulator/stress.sh "$APK" stress-out 2500; S=$?; echo "STRESS EXIT: $S"; [ $W = 0 ] && [ $S = 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "stability-api-${{ matrix.api }}"
          path: |
            emu-out/
            stress-out/
          retention-days: 14
