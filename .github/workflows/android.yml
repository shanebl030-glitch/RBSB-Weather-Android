# Builds RBSB-Weather for Android and runs its tests on every push.
# Created By Shane BlackbuRn
name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build the APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APK and its checksum
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/rbsb-weather-android_${VERSION}.apk"
          cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rbsb-weather-android-apk
          path: out/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
