# Runs RBSB-Weather on a real Android emulator and drives it like a person (add a place, Moon,
# Earth, Earth Globe, zoom, spin, drag), printing Android's crash log if it closes.
# Created By Shane BlackbuRn
name: Emulator check

on:
  push:
    branches: ["repro/**"]
  workflow_dispatch:

permissions:
  contents: write          # only to publish the screenshots to the emulator-shots branch

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 256M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator/drive.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)" emu-out
      - name: Publish screenshots to the emulator-shots branch
        if: always()
        run: |
          [ -d emu-out ] || exit 0
          cd emu-out && rm -f ui.xml
          git init -q -b emulator-shots && git add -A
          git -c user.name="RBSB-Weather CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Emulator check: ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" emulator-shots
