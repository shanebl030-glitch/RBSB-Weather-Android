# Experiment (repro branch only, throwaway keys): key rotation from the public test key.
# Created By Shane BlackbuRn
name: Key rotation check
on:
  push:
    branches: ["repro/key-rotation"]
permissions: { contents: read }
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { api: [29, 30, 31, 33, 34, 35] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 0.7.2 and a later test build
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk v072-test.apk
          sed -i 's/versionCode = 14/versionCode = 15/' app/build.gradle.kts
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk v15-test.apk
      - name: Throwaway new key, lineage, rotated signing (the same commands as release.yml)
        env: { SP: "newpass123", KP: "newpass123", KA: "rbsb-release" }
        run: |
          set -e
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1); echo "$AS"
          K="$RUNNER_TEMP/release.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$K" -storepass "$SP" -alias "$KA" -keyalg RSA -keysize 4096 -validity 10950 -dname "CN=throwaway test" -noprompt
          export SP KP
          "$AS" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest \
              --set-installed-data true --set-permission true --set-rollback false --set-shared-uid false --set-auth false \
            --new-signer --ks "$K" --ks-pass env:SP --ks-key-alias "$KA" --key-pass env:KP
          "$AS" lineage --in "$RUNNER_TEMP/lineage.bin" --print-certs -v | grep -E "Signer #|certificate SHA-256|Has "
          for v in v072 v15; do
            "$AS" sign --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest \
              --next-signer --ks "$K" --ks-pass env:SP --ks-key-alias "$KA" --key-pass env:KP \
              --lineage "$RUNNER_TEMP/lineage.bin" --rotation-min-sdk-version 28 \
              --out $v-rot.apk $v-test.apk
            "$AS" verify --verbose --print-certs --min-sdk-version 29 $v-rot.apk | tee signer-$v.txt | grep -E "Verified using v3 |V3.0 Signer: certificate SHA-256|^Signer #1 certificate SHA-256"
          done
          # what each Android version verifies: scheme and signer
          for n in 29 30 31 32 33 34 35; do
            echo "-- Android API $n:"
            "$AS" verify --verbose --print-certs --min-sdk-version $n --max-sdk-version $n v072-rot.apk | grep -E "Verified using v(2|3|3.1) |certificate SHA-256 digest" | grep -v "in lineage" | sed "s/^/   API $n: /"
          done
          # an attacker who has the public test key: (1) their own key only, (2) their own hand-over from the test key
          keytool -genkeypair -storetype PKCS12 -keystore atk.p12 -storepass atkpass123 -alias atk -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=attacker" -noprompt
          "$AS" sign --ks atk.p12 --ks-pass pass:atkpass123 --ks-key-alias atk --out v15-atk-only.apk v15-test.apk
          "$AS" rotate --out atk-lineage.bin \
            --old-signer --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest \
              --set-installed-data true --set-permission true --set-rollback true --set-shared-uid true --set-auth true \
            --new-signer --ks atk.p12 --ks-pass pass:atkpass123 --ks-key-alias atk
          "$AS" sign --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest \
            --next-signer --ks atk.p12 --ks-pass pass:atkpass123 --ks-key-alias atk \
            --lineage atk-lineage.bin --rotation-min-sdk-version 28 --out v15-atk-handover.apk v15-test.apk
          GOT=$(grep -m1 -E "^Signer #1 certificate SHA-256 digest|^V3.0 Signer: certificate SHA-256 digest" signer-v072.txt | awk '{print $NF}')
          FP=$(keytool -list -v -keystore "$K" -storepass "$SP" -alias "$KA" | grep -m1 "SHA256:" | awk '{print $2}')
          norm() { echo "$1" | tr -d ': ' | tr 'A-F' 'a-f'; }
          [ "$(norm "$GOT")" = "$(norm "$FP")" ] && echo "SIGNER CHECK OK ($GOT = keytool $FP)" || { echo "SIGNER CHECK FAILED: $GOT vs $FP"; exit 1; }
          rm -f "$K"
      - name: Download 0.6.2
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v0.6.2 -R "$GITHUB_REPOSITORY" -p "rbsb-weather-android_0.6.2.apk" -D base
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator/key-rotation.sh base/rbsb-weather-android_0.6.2.apk v072-rot.apk v15-test.apk v15-rot.apk rot-out v15-atk-only.apk v15-atk-handover.apk
