# Experiment (repro branch only, throwaway keys): key rotation from the public test key.
# Created By Shane BlackbuRn
name: Key rotation check
on:
  push:
    branches: ["repro/key-rotation"]
permissions: { contents: read }
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { api: [29, 34] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 0.7.2 and a later test build
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk v072-test.apk
          sed -i 's/versionCode = 14/versionCode = 15/' app/build.gradle.kts
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk v15-test.apk
      - name: Throwaway new key, lineage, rotated signing
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1); echo "$AS"
          keytool -genkeypair -keystore new.jks -storepass newpass123 -keypass newpass123 -alias newkey -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=throwaway test" -noprompt
          "$AS" rotate --out lineage.bin \
            --old-signer --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest --set-installed-data false --set-rollback false \
            --new-signer --ks new.jks --ks-pass pass:newpass123 --ks-key-alias newkey
          "$AS" lineage --in lineage.bin --print-certs -v
          for v in v072 v15; do
            "$AS" sign --ks keystore/rbsb-test.keystore --ks-pass pass:rbsbtest --ks-key-alias rbsbtest \
              --next-signer --ks new.jks --ks-pass pass:newpass123 --ks-key-alias newkey \
              --lineage lineage.bin --rotation-min-sdk-version 28 --out $v-rot.apk $v-test.apk
            "$AS" verify --verbose --print-certs $v-rot.apk | grep -E "Verified using|Signer|certificate SHA-256" 
          done
      - name: Download 0.6.2
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v0.6.2 -R "$GITHUB_REPOSITORY" -p "rbsb-weather-android_0.6.2.apk" -D base
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/emulator/key-rotation.sh base/rbsb-weather-android_0.6.2.apk v072-rot.apk v15-test.apk v15-rot.apk rot-out
