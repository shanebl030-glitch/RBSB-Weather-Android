# Builds a release of RBSB-Weather for Android, signed with Shane's own release key, and puts it
# in a DRAFT GitHub release for him to check and publish. Run by hand only (Actions → Release →
# Run workflow), from main.
#
# The release key never touches the repository. It comes from four encrypted repository secrets:
#   RBSB_RELEASE_KEYSTORE_B64     the keystore file, base64-encoded
#   RBSB_RELEASE_STORE_PASSWORD   the keystore's password
#   RBSB_RELEASE_KEY_ALIAS        the key's alias
#   RBSB_RELEASE_KEY_PASSWORD     the key's password
# and one repository variable (not secret) the APK's certificate must match:
#   RBSB_RELEASE_CERT_SHA256      the certificate's SHA-256 fingerprint (keytool -list -v)
# The keystore is written to the runner's temporary folder only for the build and deleted after.
#
# Created By Shane BlackbuRn
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.7.2); must match versionName"
        required: true
        default: "v0.7.2"

permissions:
  contents: write          # to create the draft release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are built from main only (this is ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Robolectric's Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1-sdk34

      - name: Version matches the tag
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "versionName $VERSION, tag ${{ inputs.tag }}"
          [ "v$VERSION" = "${{ inputs.tag }}" ] || { echo "The tag doesn't match versionName."; exit 1; }
          grep -q "const val NAME = \"$VERSION\"" app/src/main/java/io/github/shanebl030glitch/rbsbweather/data/Version.kt || { echo "Version.kt doesn't match."; exit 1; }

      - name: The release key is there (the public test key never signs a release)
        env:
          KS: ${{ secrets.RBSB_RELEASE_KEYSTORE_B64 }}
          SP: ${{ secrets.RBSB_RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.RBSB_RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RBSB_RELEASE_KEY_PASSWORD }}
          FP: ${{ vars.RBSB_RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing RBSB_RELEASE_KEYSTORE_B64"
          [ -n "$SP" ] || missing="$missing RBSB_RELEASE_STORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing RBSB_RELEASE_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing RBSB_RELEASE_KEY_PASSWORD"
          [ -n "$FP" ] || missing="$missing RBSB_RELEASE_CERT_SHA256(variable)"
          [ -z "$missing" ] || { echo "Missing:$missing"; exit 1; }

      - name: Tests (the full suite)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Test totals
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = sk = 0
          for x in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(x).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); sk += int(r.get("skipped", 0))
          print(f"TEST TOTALS: {t} run, {t - f - e - sk} passed, {f} failed, {e} errors, {sk} skipped")
          PY
      - name: Lint (errors fail the release)
        run: |
          ./gradlew --no-daemon lintRelease
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys
          issues = ET.parse("app/build/reports/lint-results-release.xml").getroot().findall("issue")
          errors = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
          print(f"LINT: {len(errors)} errors, {len(issues) - len(errors)} warnings")
          sys.exit(1 if errors else 0)
          PY

      - name: Build the APK, signed with the release key
        env:
          KS: ${{ secrets.RBSB_RELEASE_KEYSTORE_B64 }}
          RBSB_RELEASE_STORE_PASSWORD: ${{ secrets.RBSB_RELEASE_STORE_PASSWORD }}
          RBSB_RELEASE_KEY_ALIAS: ${{ secrets.RBSB_RELEASE_KEY_ALIAS }}
          RBSB_RELEASE_KEY_PASSWORD: ${{ secrets.RBSB_RELEASE_KEY_PASSWORD }}
        run: |
          export RBSB_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KS" | base64 -d > "$RBSB_RELEASE_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RBSB_RELEASE_KEYSTORE"

      - name: Check the signature (release key, not the test key) and make the checksums
        env:
          FP: ${{ vars.RBSB_RELEASE_CERT_SHA256 }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/rbsb-weather-android_${VERSION}.apk"
          "$APKSIGNER" verify --verbose --print-certs "out/rbsb-weather-android_${VERSION}.apk" | tee signer.txt
          norm() { echo "$1" | tr -d ': ' | tr 'A-F' 'a-f'; }
          GOT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          TEST=a9618b324c0ed08d0850953843fe7d6ea4aef6353ccaaffc3e6e53ad4a36e87c
          [ "$(norm "$GOT")" != "$TEST" ] || { echo "Signed with the public TEST key: stopped."; exit 1; }
          [ "$(norm "$GOT")" = "$(norm "$FP")" ] || { echo "Signed with an unexpected key ($GOT): stopped."; exit 1; }
          echo "SIGNER OK: certificate SHA-256 $GOT"
          cp "docs/AUDIT_REPORT_${VERSION}.md" "docs/RELEASE_NOTES_${VERSION}.md" out/
          cd out && sha256sum "rbsb-weather-android_${VERSION}.apk" > SHA256SUMS && sha256sum -c SHA256SUMS && cat SHA256SUMS

      - name: Draft GitHub release (Shane checks and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "${{ inputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "RBSB-Weather-Android ${VERSION}" --notes-file "docs/RELEASE_NOTES_${VERSION}.md" \
            "out/rbsb-weather-android_${VERSION}.apk" out/SHA256SUMS "out/AUDIT_REPORT_${VERSION}.md" "out/RELEASE_NOTES_${VERSION}.md"
          echo "Draft release created from commit $GITHUB_SHA"
